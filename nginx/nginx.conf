worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream bot_upstream {
        server bot:8080;
    }

    server {
        listen 80;
        server_name _;

        location /health {
            proxy_pass http://bot_upstream/health;
        }

        location /webhook {
            proxy_pass http://bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Раскомментируйте этот блок для HTTPS, укажите свой домен
    # и положите сертификаты в nginx/ssl (fullchain.pem и privkey.pem).
