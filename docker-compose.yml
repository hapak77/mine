version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pdd_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdd_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-pdd_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdd_user} -d ${POSTGRES_DB:-pdd_database}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pdd_network

  redis:
    image: redis:7-alpine
    container_name: pdd_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pdd_network

  bot:
    build: .
    container_name: pdd_aiogram_bot
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8080"
    networks:
      - pdd_network

  nginx:
    image: nginx:alpine
    container_name: pdd_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - bot
    networks:
      - pdd_network

volumes:
  postgres_data:
  redis_data:

networks:
  pdd_network:
    driver: bridge
